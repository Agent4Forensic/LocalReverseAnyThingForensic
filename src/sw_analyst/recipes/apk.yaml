id: apk
description: Android packages. Static analysis only.
detect: {types: [apk]}
steps:
  - id: container
    title: APK container structure
    goal: List archive members, identify classes*.dex, native libraries (lib/<abi>), assets and signature files, and note anomalies (extra dex, encrypted assets, odd names).
    done_when: Archive members are grouped into dex, native libraries, assets and signature files with anomalies noted and evidence, or a finding names why the archive could not be listed.
    guide: Call zip_list and group the members. Several classes*.dex is normal for large apps; note it, do not call it packing. Native libraries and unusual assets are candidates for follow-up.
    priority: 100
    tools_hint: [zip_list]
  - id: manifest_hints
    title: Manifest and permission hints
    goal: Decode AndroidManifest.xml and list requested permissions, components with their exported flag and entry points with evidence.
    done_when: Permissions, components and entry points are listed with evidence from AndroidManifest.xml, or a finding names why apk_manifest could not decode it.
    guide: Call apk_manifest. It returns package, permissions, components and the decoded XML. Do not list permissions you did not see. Exported components are candidates for follow-up.
    priority: 120
    tools_hint: [apk_manifest]
  - id: strings_endpoints
    title: Strings and endpoints
    goal: Extract strings from text members and assets; list URLs, domains, IPs, API keys-like values and command words with offsets.
    done_when: URLs, domains, IPs, key-like values and command words are listed with member and offset, or a finding states none in readable members, and a finding names members the tools could not search.
    guide: zip_read_text reads text members such as assets/*.json, *.xml, *.txt. For a binary member, save it with zip_extract and use strings_extract on the derived file. If jadx_decompile is offered, its search finds endpoints in code; otherwise DEX contents stay a GAP, do not guess endpoints.
    priority: 140
    tools_hint: [zip_list, zip_read_text, zip_extract, strings_extract]
  - id: payload_hints
    title: Dynamic loading and embedded payloads
    goal: Look for dynamic code loading, reflection, encrypted assets and native loaders; describe what is indicated and what is not determinable without a decompiler.
    done_when: Any indications of dynamic loading, encrypted assets and native loaders are listed as hypotheses with member evidence, and a finding names what stays undeterminable without a decompiler.
    guide: Only member names and sizes are available for binary members. Say what they suggest as hypothesis and which decompiler step would settle it.
    priority: 160
    tools_hint: [zip_list, zip_extract, entropy_map]
  - id: jadx_code
    title: Decompiled code
    goal: Decompile the app, read the entry points named in the manifest and the code behind suspicious permissions, endpoints and dynamic loading.
    done_when: Each manifest entry point and each suspicious behaviour is backed by a quoted class and line, or a finding names what could not be decompiled.
    guide: Call jadx_decompile without arguments for the class list (the first call can take minutes), use search for DexClassLoader, Runtime.exec, URLs and permission APIs, then read classes with class_file. Quote class and line. Decompiler output only approximates the code. Code in native libraries is not covered; extract a library with zip_extract, the platform triages it.
    priority: 170
    tools_hint: [jadx_decompile]
    requires_tools: [jadx_decompile]
required_questions:
  - What does the app do (main function)?
  - Which permissions and components are security relevant?
  - Which endpoints and indicators can be derived statically?
