id: apk
description: Android packages. Static analysis only.
detect: {types: [apk]}
steps:
  - id: container
    title: APK container structure
    goal: List archive members, identify classes*.dex, native libraries (lib/<abi>), assets and signature files, and note anomalies (extra dex, encrypted assets, odd names).
    done_when: Archive members are grouped into dex, native libraries, assets and signature files with anomalies noted and evidence, or a finding names why the archive could not be listed.
    guide: Call zip_list and group the members. Several classes*.dex is normal for large apps; note it, do not call it packing. Native libraries and unusual assets are candidates for follow-up.
    priority: 100
    tools_hint: [zip_list]
  - id: manifest_hints
    title: Manifest and permission hints
    goal: Read what can be read of AndroidManifest.xml (binary XML may need strings extraction) and list requested permissions, components and entry points with evidence.
    done_when: Permissions, components and entry points are listed with evidence from AndroidManifest.xml, or a finding names the limit that blocked reading it, such as the missing manifest parser.
    guide: AndroidManifest.xml is binary XML and zip_read_text refuses it, and compressed members are invisible to strings_extract. Try zip_read_text once; if refused, name a GAP (manifest parser missing) and use only readable members. Do not list permissions you did not see.
    priority: 120
    tools_hint: [zip_list, zip_read_text]
  - id: strings_endpoints
    title: Strings and endpoints
    goal: Extract strings from text members and assets; list URLs, domains, IPs, API keys-like values and command words with offsets.
    done_when: URLs, domains, IPs, key-like values and command words are listed with member and offset, or a finding states none in readable members, and a finding names members the tools could not search.
    guide: zip_read_text reads text members such as assets/*.json, *.xml, *.txt. DEX members cannot be searched with the current tools, name that as a GAP instead of guessing endpoints.
    priority: 140
    tools_hint: [zip_list, zip_read_text]
  - id: payload_hints
    title: Dynamic loading and embedded payloads
    goal: Look for dynamic code loading, reflection, encrypted assets and native loaders; describe what is indicated and what is not determinable without a decompiler.
    done_when: Any indications of dynamic loading, encrypted assets and native loaders are listed as hypotheses with member evidence, and a finding names what stays undeterminable without a decompiler.
    guide: Only member names and sizes are available for binary members. Say what they suggest as hypothesis and which decompiler step would settle it.
    priority: 160
    tools_hint: [zip_list, entropy_map]
required_questions:
  - What does the app do (main function)?
  - Which permissions and components are security relevant?
  - Which endpoints and indicators can be derived statically?
