id: generic
description: Fallback recipe for unknown or plain-text files.
detect: {types: [unknown, text]}
steps:
  - id: structure
    title: Describe file structure and content class
    goal: Establish what kind of data the file contains (text, binary, container) using hexdump, entropy_map and strings_extract, and summarise notable regions with offsets.
    done_when: Findings state the data class (text, binary or container) and notable regions with offsets, or report no notable regions in the file, or name the limit that prevented classification.
    guide: For text use read_lines first; for binary use hexdump of the start and entropy_map. Long base64 or hex runs are encoded data - decode them with decode_layer (offset and length of the run only, or method auto) and read the result, it may hold the real content.
    priority: 100
    tools_hint: [read_lines, hexdump, entropy_map, strings_extract, decode_layer]
  - id: indicators
    title: Extract indicators and notable strings
    goal: List URLs, domains, IP addresses, file paths, registry paths, e-mail addresses, commands and credentials-like strings found in the file, each with its offset or line.
    done_when: Findings list each URL, domain, IP, path, e-mail, command and credential-like string with its file and offset or line, or report none in the named files, or name the tool limit.
    guide: Use strings_extract for binary and grep for text. Include derived/ files from earlier tasks and name the file for each indicator.
    priority: 110
    tools_hint: [strings_extract, grep]
required_questions:
  - What is this file and what is it used for?
  - Which indicators of compromise can be derived statically?
